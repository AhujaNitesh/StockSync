<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSync — Auth Portal (Sri Ganesh General Stores)</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <nav class="glass-navbar d-flex justify-content-between align-items-center">
    <a href="index.html" class="brand-logo">
      <i class="fa-solid fa-store fs-3 text-info"></i>
      <span>StockSync <small style="font-size:0.75rem;color:var(--cyan)">v2.5 Dark</small></span>
    </a>
    <a href="index.html" class="btn btn-sm btn-outline-light">
      <i class="fa-solid fa-house me-1"></i> Back to Home
    </a>
  </nav>

  <div class="container auth-wrapper">
    <div class="custom-card p-4" style="max-width:460px; width:100%">
      <div class="text-center mb-4">
        <div class="kpi-icon-bubble kpi-cyan mx-auto mb-3"><i class="fa-solid fa-user-lock fs-2"></i></div>
        <h3 class="fw-bold text-info">StockSync Auth Portal</h3>
        <p style="color: var(--text-sub)">Select user role dropdown to log in</p>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" style="color:var(--cyan);font-weight:700">Select User / Role Dropdown</label>
          <select id="loginRoleSelect" class="form-select">
            <option value="admin">Owner / Store Admin (Full Access)</option>
            <option value="manager">Supervisor / Store Manager (Revenue Redacted)</option>
            <option value="employee">Cashier / Sales Staff (POS Only)</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" style="color:var(--cyan);font-weight:700">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label" style="color:var(--cyan);font-weight:700">Password / Passkey</label>
          <input type="password" id="loginPassword" class="form-control" required />
          <small class="text-info d-block mt-1">
            Hint password: <code id="hintPassword">admin123</code>
          </small>
        </div>

        <div id="loginError" class="alert alert-danger p-2 small mb-3 text-center d-none" role="alert"></div>

        <button type="submit" class="btn-gradient w-100 justify-content-center py-2 mb-3">
          <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Store Dashboard
        </button>
      </form>

      <div class="p-3 rounded text-center" style="background: #070a12; border: 1px solid var(--card-border)">
        <span class="small d-block mb-1" style="color: var(--text-sub)">Security Access Scope:</span>
        <span id="roleBadge" class="badge bg-danger fs-6">Owner (Full Access)</span>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
